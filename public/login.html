<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#2563eb">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack – Login</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { opacity: 0; transition: opacity 0.2s; }
    body.auto-mode, body.light-mode, body.dark-mode, body.page-loaded { opacity: 1; }
    .back-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 8px 16px;
      border-radius: 30px;
      margin-bottom: 20px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }
    .back-btn:hover {
      background: var(--primary-500);
      color: white;
      border-color: var(--primary-500);
      transform: translateX(-5px);
    }
  </style>
</head>
<body class="auto-mode">
  <div class="auth-container">
    <aside class="auth-left">
      <h1>FinTrack</h1>
      <p>Smart Student Expense Management</p>
      <img src="images/3d-render-secure-login-password-illustration.png" alt="Login" class="brand-icon floating" width="300">
    </aside>
    <main class="auth-right">
      <button class="back-btn" onclick="goBack()">← Back to Home</button>
      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to continue</p>
      <form id="loginForm">
        <p id="msg" style="color:#ff6b6b; text-align:center; margin-bottom:10px;"></p>
        <div class="floating-label-group">
          <input type="email" id="email" name="email" placeholder=" " required autocomplete="email">
          <label for="email">Email</label>
        </div>
        <div class="floating-label-group">
          <input type="password" id="password" placeholder=" " required autocomplete="current-password">
          <label for="password">Password</label>
        </div>
        <button type="submit" class="login-btn">Login</button>
      </form>
      <div class="social-login">
        <button type="button" class="social-btn google-btn" onclick="window.location.href='/api/auth/google'">
          <img src="images/google.png" alt="Google">
          <span>Sign in with Google</span>
        </button>
        <button type="button" class="social-btn github-btn" onclick="window.location.href='/api/auth/github'">
          <img src="images/GitLogo.png" alt="GitHub">
          <span>Sign in with GitHub</span>
        </button>
      </div>
      <p class="register-link">Don't have an account? <a href="register.html">Register</a></p>
    </main>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    if (token && token !== "undefined") {
      localStorage.setItem("token", token);
      window.location.href = "dashboard.html";
    }
  </script>
  <script src="js/ui-effects.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
