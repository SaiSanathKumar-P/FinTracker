<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="theme-color" content="#2563eb">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack – Profile</title>
  <script>
    (function(){
      try {
        const saved = localStorage.getItem("theme") || "auto-mode";
        document.documentElement.classList.add(saved);
        document.body?.classList?.add(saved);
      } catch(e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/style.css?v=4.2">
  <style>
    body { opacity: 0; transition: opacity 0.25s ease; }
    body.page-loaded { opacity: 1; }
    .profile-container { max-width: 800px; margin: 0 auto; padding: 20px; }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }
    .profile-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary-500), var(--primary-600));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: bold;
      color: white;
      box-shadow: 0 10px 30px rgba(56,189,248,0.4);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin: 30px 0;
    }
    .stat-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-500);
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .info-section {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 20px;
      border: 1px solid var(--border-color);
    }
    .info-row {
      display: flex;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
    }
    .info-label { width: 120px; color: var(--text-muted); }
  </style>
</head>
<body class="auto-mode">
<div class="dashboard-wrapper">
  <header class="topbar">
    <h1 class="logo" onclick="window.location.href='dashboard.html'" style="cursor: pointer;">FinTrack</h1>
    <div class="topbar-right">
      <div class="theme-dropdown" id="themeDropdown">
        <button class="theme-btn" id="themeBtn">
          <span class="theme-icon">🌓</span>
          <span id="themeLabel">Both</span>
        </button>
        <div id="themeMenu" class="theme-menu" role="menu">
          <div role="menuitem" data-theme="light">☀️ Light</div>
          <div role="menuitem" data-theme="dark">🌙 Dark</div>
          <div role="menuitem" data-theme="auto">🌓 Both</div>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <div class="profile-container">
    <div class="profile-header">
      <div class="profile-avatar" id="userInitials">👤</div>
      <div>
        <h2 id="userFullName">Loading...</h2>
        <p id="userEmail" style="color: var(--text-muted);">Loading...</p>
        <p id="userCollege">Loading...</p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalBalance">₹0</div>
        <div class="stat-label">Balance</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalDeposits">₹0</div>
        <div class="stat-label">Deposits</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="totalWithdraws">₹0</div>
        <div class="stat-label">Withdraws</div>
      </div>
    </div>

    <div class="quick-actions">
      <button class="nav-btn" onclick="window.location.href='dashboard.html'">📊 Dashboard</button>
      <button class="nav-btn" onclick="window.location.href='profile.html'">👤 Profile</button>
      <button class="nav-btn">💳 Cards</button>
      <button class="nav-btn">📈 Summary</button>
      <button class="nav-btn">🔒 Security</button>
      <button class="nav-btn" id="profileLogoutBtn">🚪 Logout</button>
    </div>

    <div class="info-section">
      <h3>Personal Information</h3>
      <div class="info-row"><span class="info-label">Full Name</span><span class="info-value" id="infoName">-</span></div>
      <div class="info-row"><span class="info-label">Email</span><span class="info-value" id="infoEmail">-</span></div>
      <div class="info-row"><span class="info-label">College</span><span class="info-value" id="infoCollege">-</span></div>
      <div class="info-row"><span class="info-label">Year</span><span class="info-value" id="infoYear">-</span></div>
      <div class="info-row"><span class="info-label">Member Since</span><span class="info-value" id="infoJoined">-</span></div>
    </div>

    <div style="text-align: center; margin-top: 30px; color: var(--text-muted); font-size: 12px;">
      <p>FinTrack Pro • Privacy & Terms • Version 8.4.5</p>
    </div>
  </div>
</div>

<script src="js/ui-effects.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Check if user is authenticated
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
      return;
    }
    
    // Load user data
    const userData = JSON.parse(localStorage.getItem('finTrack_user') || '{}');
    console.log('Loading user data:', userData);
    
    // Helper function to safely set text content
    function setElementText(id, text) {
      const el = document.getElementById(id);
      if (el) el.textContent = text || '-';
    }
    
    // Set user information
    if (userData.name) {
      setElementText('userFullName', userData.name);
      setElementText('infoName', userData.name);
      
      // Calculate initials
      const nameParts = userData.name.split(' ').filter(part => part.length > 0);
      let initials = '👤';
      if (nameParts.length >= 2) {
        initials = (nameParts[0][0] + nameParts[1][0]).toUpperCase();
      } else if (nameParts.length === 1) {
        initials = nameParts[0].substring(0, 2).toUpperCase();
      }
      document.getElementById('userInitials').textContent = initials;
    }
    
    if (userData.email) {
      setElementText('userEmail', userData.email);
      setElementText('infoEmail', userData.email);
    }
    
    if (userData.college) {
      setElementText('userCollege', userData.college + ' • Year ' + (userData.year || '1'));
      setElementText('infoCollege', userData.college);
    }
    
    if (userData.year) {
      setElementText('infoYear', userData.year + (userData.year.endsWith('th') ? '' : 'th Year'));
    }
    
    // Set joined date
    const joinDate = new Date();
    setElementText('infoJoined', joinDate.toLocaleDateString('en-US', { month: 'short', year: 'numeric' }));
    
    // Load financial data
    const total = localStorage.getItem('finTrack_totalAmount') || '0';
    setElementText('totalBalance', '₹' + total);
    setElementText('totalDeposits', '₹' + total);
    setElementText('totalWithdraws', '₹' + total);

    document.body.classList.add('page-loaded');
  });

  // Logout - Only remove token, keep user data
  function logout() { 
    localStorage.removeItem('token'); 
    window.location.href = 'login.html'; 
  }

  document.getElementById('logoutBtn')?.addEventListener('click', logout);
  document.getElementById('profileLogoutBtn')?.addEventListener('click', logout);

  // Theme system
  function initTheme() {
    const themeBtn = document.getElementById("themeBtn");
    const themeMenu = document.getElementById("themeMenu");
    const dropdown = document.getElementById("themeDropdown");
    const themeLabel = document.getElementById("themeLabel");
    const themeIcon = document.querySelector(".theme-icon");

    function applyTheme(theme) {
      document.body.classList.remove("light-mode", "dark-mode", "auto-mode");
      document.body.classList.add(theme + "-mode");
      if (themeLabel) themeLabel.innerText = theme.charAt(0).toUpperCase() + theme.slice(1);
      if (themeIcon) {
        const icons = { light: '☀️', dark: '🌙', auto: '🌓' };
        themeIcon.textContent = icons[theme] || '🌓';
      }
      localStorage.setItem("theme", theme);
    }

    const savedTheme = localStorage.getItem("theme") || "auto";
    applyTheme(savedTheme);

    themeBtn.onclick = (e) => { e.stopPropagation(); dropdown.classList.toggle("active"); };
    themeMenu.querySelectorAll("[data-theme]").forEach(item => {
      item.onclick = (e) => { e.stopPropagation(); applyTheme(item.dataset.theme); dropdown.classList.remove("active"); };
    });
    document.addEventListener("click", (e) => { if (!e.target.closest(".theme-dropdown")) dropdown.classList.remove("active"); });
  }
  initTheme();
</script>
</body>
</html>
