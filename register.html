<!DOCTYPE html>
<html>
<head>
  <title>FinTrack Register</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>

<div class="auth-container">

  <div class="auth-left">
      <h1>FinTrack</h1>
      <p>Smart Student Expense Management</p>

      <img src="images/3d-render-secure-login-password-illustration.png"
           alt="Register Illustration"
           class="brand-icon">
  </div>

  <div class="auth-right">

      <h2>Create Account 🚀</h2>
      <p class="subtitle">Start managing your finances today</p>

      <!-- ✅ CORRECT FORM ID -->
      <form id="registerForm">

          <div class="input-group">
              <input type="text" id="name" placeholder="Full Name" required>
          </div>

          <div class="input-group">
              <input type="email" id="email" placeholder="Email" required autocomplete="email" required>
          </div>

          <div class="input-group">
              <input type="text" id="college" placeholder="College" required>
          </div>

          <div class="input-group">
              <input type="text" id="year" placeholder="Year" required>
          </div>

          <div class="input-group">
              <input type="password" id="password" placeholder="Password" required autocomplete="new-password" required>
          </div>

          <button type="submit" class="login-btn">Register</button>
      </form>

      <p class="register-link">
          Already have account?
          <a href="login.html">Login</a>
      </p>

  </div>

</div>

<script src="js/auth.js"></script>
</body>
</html>
